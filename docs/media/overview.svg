<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Log Filter workflow</title><desc id="desc">Open a log. Select a level. Read the preview. The preview updates after edits and saves.</desc>
<rect width="1200" height="390" rx="20" fill="#f7faf9"/>
<g font-family="Nunito Sans, Arial, sans-serif" fill="#18181b">
<text x="44" y="65" font-size="38" font-weight="700">Log Filter</text>
<text x="44" y="104" font-size="23" fill="#4b5563">Read the lines you need. Keep the original file.</text>
<rect x="44" y="150" width="348" height="139" rx="14" fill="#ffffff" stroke="#d6dfdc"/>
<text x="66" y="181" font-size="17" fill="#034c32" font-weight="700">01</text>
<text x="66" y="220" font-size="25" font-weight="700">Open a log</text>
<text x="66" y="259" font-size="17" fill="#4b5563">A .log file in your editor</text>
<path d="M401 219h18m-6-6 6 6-6 6" fill="none" stroke="#034c32" stroke-width="2"/>
<rect x="426" y="150" width="348" height="139" rx="14" fill="#ffffff" stroke="#d6dfdc"/>
<text x="448" y="181" font-size="17" fill="#034c32" font-weight="700">02</text>
<text x="448" y="220" font-size="25" font-weight="700">Select a level</text>
<text x="448" y="259" font-size="17" fill="#4b5563">DEBUG / INFO / WARNING / ERROR</text>
<path d="M783 219h18m-6-6 6 6-6 6" fill="none" stroke="#034c32" stroke-width="2"/>
<rect x="808" y="150" width="348" height="139" rx="14" fill="#ffffff" stroke="#d6dfdc"/>
<text x="830" y="181" font-size="17" fill="#034c32" font-weight="700">03</text>
<text x="830" y="220" font-size="25" font-weight="700">Read the preview</text>
<text x="830" y="259" font-size="17" fill="#4b5563">Matching lines + optional context</text>
<text x="44" y="345" font-size="21" fill="#034c32">The preview updates after edits and saves.</text>
</g></svg>